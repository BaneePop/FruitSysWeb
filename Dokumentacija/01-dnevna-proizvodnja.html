<!DOCTYPE html>
<html lang="sr"><head><meta charset="UTF-8">
<title>Dnevna proizvodnja kroz sezonu — REALNI PODACI</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1"></script>
<style>
:root{--bg:#f4f6fa;--card:#fff;--text:#1a2332;--muted:#6b7280;--accent:#2563eb;--border:#e5e7eb}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);padding:24px}
.container{max-width:1300px;margin:0 auto}
.header{background:linear-gradient(135deg,#2563eb,#1e40af);color:#fff;padding:24px;border-radius:12px;margin-bottom:20px}
.header h1{font-size:22px;margin-bottom:4px}
.header p{opacity:.85;font-size:14px}
.badge-live{display:inline-block;background:#10b981;color:#fff;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600;margin-left:8px}
.controls{background:var(--card);padding:16px 20px;border-radius:10px;margin-bottom:20px;display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.field select,.field input{padding:8px 12px;border:1px solid var(--border);border-radius:6px;font-size:14px;background:#fff;min-width:180px}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:20px}
.kpi{background:var(--card);padding:18px 20px;border-radius:10px;border-left:4px solid var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.05)}
.kpi .label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.kpi .value{font-size:24px;font-weight:700;margin-top:4px}
.kpi .sub{font-size:12px;color:var(--muted);margin-top:4px}
.chart-card{background:var(--card);border-radius:10px;padding:24px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.chart-card h3{font-size:16px;margin-bottom:16px}
.chart-wrap{height:440px}
</style></head><body>

</div>

  let filt = DATA.filter(r=> r.datum>=od && r.datum<=doD && (art==='__SVI__' || r.artikal===art));

  const bucket = {};
  filt.forEach(r=>{
    let key;
    const d = new Date(r.datum);
    if(gran==='nedelja'){ const w = new Date(d); w.setDate(w.getDate()-w.getDay()); key = w.toISOString().slice(0,10); }
    else if(gran==='mesec'){ key = r.datum.slice(0,7); }
    else key = r.datum;
    bucket[key] = (bucket[key]||0) + r.kg;
  });
  const labels = Object.keys(bucket).sort();
  const values = labels.map(k=>bucket[k]);

  const ukupno = values.reduce((a,b)=>a+b,0);
  const prosek = values.length ? ukupno/values.length : 0;
  const maxV = Math.max(...values, 0);
  const maxI = values.indexOf(maxV);

  document.getElementById('kpi-ukupno').textContent = fmt(ukupno);
  document.getElementById('kpi-prosek').textContent = fmt(prosek);
  document.getElementById('kpi-max').textContent = fmt(maxV);
  document.getElementById('kpi-max-sub').textContent = labels[maxI] || '—';
  document.getElementById('kpi-dani').textContent = values.filter(v=>v>0).length;
  document.getElementById('chart-title').textContent = `Dnevna proizvodnja — ${art==='__SVI__'?'svi artikli':art} (${gran})`;

  if(chart) chart.destroy();
  chart = new Chart(document.getElementById('chart'),{
    type: gran==='dan' ? 'line' : 'bar',
    data:{labels, datasets:[{label:'kg', data:values, borderColor:'#2563eb', backgroundColor:'rgba(37,99,235,.25)', fill:true, tension:.3, pointRadius:1, borderWidth:2, borderRadius:4}]},
    options:{responsive:true, maintainAspectRatio:false,
      plugins:{legend:{display:false}, tooltip:{callbacks:{label:c=>fmt(c.parsed.y)+' kg'}}},
      scales:{y:{beginAtZero:true, ticks:{callback:v=>fmt(v)+' kg'}}, x:{ticks:{maxTicksLimit:20}}}}
  });
}
['filter-artikal','filter-od','filter-do','filter-gran'].forEach(id=>document.getElementById(id).addEventListener('change',render));
render();
</script></body></html>
