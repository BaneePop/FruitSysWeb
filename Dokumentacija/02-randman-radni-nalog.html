<html lang="sr"><head><meta charset="UTF-8">
<title>Randman po radnom nalogu — REALNI PODACI</title>

<style>
:root{--bg:#f4f6fa;--card:#fff;--text:#1a2332;--muted:#6b7280;--border:#e5e7eb}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);padding:24px}
.container{max-width:1250px;margin:0 auto}
.header{background:linear-gradient(135deg,#059669,#047857);color:#fff;padding:24px;border-radius:12px;margin-bottom:20px}
.header h1{font-size:22px;margin-bottom:4px}
.header p{opacity:.85;font-size:14px}
.badge-live{display:inline-block;background:#fbbf24;color:#78350f;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600;margin-left:8px}
.controls{background:var(--card);padding:16px 20px;border-radius:10px;margin-bottom:20px;display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:260px}
.field label{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.field select{padding:8px 12px;border:1px solid var(--border);border-radius:6px;font-size:14px;background:#fff}
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.kpi{background:var(--card);padding:18px 20px;border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.05);border-top:3px solid #059669}
.kpi .label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.kpi .value{font-size:26px;font-weight:700;margin-top:6px}
.kpi .sub{font-size:12px;color:var(--muted);margin-top:2px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.chart-card,.info-card{background:var(--card);border-radius:10px;padding:24px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.chart-card h3,.info-card h3{font-size:16px;margin-bottom:16px}
.chart-wrap{height:360px}
.info-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f0f0f0;font-size:14px}
.info-row:last-child{border:none}
.info-row .k{color:var(--muted)}
.info-row .v{font-weight:600;text-align:right}
.badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:600}
.badge.ok{background:#d1fae5;color:#065f46}
.badge.warn{background:#fef3c7;color:#92400e}
.badge.bad{background:#fee2e2;color:#991b1b}
@media(max-width:900px){.grid{grid-template-columns:1fr}.kpi-row{grid-template-columns:repeat(2,1fr)}}
</style></head><body>

</div>

const sel = document.getElementById('filter-rn');
sel.innerHTML = DATA.map(n=>`<option value="${n.id}">${n.id} — ${n.artikal} (${n.datum})</option>`).join('');
let chart;
const fmt = n => Math.round(n).toLocaleString('sr-RS');

function render(){
  const n = DATA.find(x=>x.id===sel.value);
  if(!n) return;
  const randman = n.ulaz ? (n.izlaz/n.ulaz*100) : 0;
  document.getElementById('kpi-ulaz').textContent = fmt(n.ulaz);
  document.getElementById('kpi-izlaz').textContent = fmt(n.izlaz);
  document.getElementById('kpi-randman').textContent = randman.toFixed(1);
  document.getElementById('kpi-rastur').textContent = fmt(n.rastur);
  let bc='ok', bt='Odličan';
  if(randman<85){bc='warn';bt='Prosečan'} if(randman<70){bc='bad';bt='Slab'}
  document.getElementById('kpi-randman-sub').innerHTML = `% · <span class="badge ${bc}">${bt}</span>`;
  document.getElementById('chart-title').textContent = `Struktura — ${n.artikal}`;
  document.getElementById('details').innerHTML = `
    <div class="info-row"><span class="k">Šifra</span><span class="v">${n.id}</span></div>
    <div class="info-row"><span class="k">Datum</span><span class="v">${n.datum}</span></div>
    <div class="info-row"><span class="k">Artikal</span><span class="v">${n.artikal}</span></div>
    <div class="info-row"><span class="k">Komitent</span><span class="v">${n.komitent}</span></div>
    <div class="info-row"><span class="k">Planirana količina</span><span class="v">${fmt(n.plan)} kg</span></div>
    <div class="info-row"><span class="k">Ukupan ulaz</span><span class="v">${fmt(n.ulaz)} kg</span></div>
    <div class="info-row"><span class="k">Ukupan izlaz</span><span class="v">${fmt(n.izlaz)} kg (${(n.izlaz/n.ulaz*100).toFixed(1)}%)</span></div>
    <div class="info-row"><span class="k">Razlika</span><span class="v">${fmt(n.rastur)} kg (${(n.rastur/n.ulaz*100).toFixed(1)}%)</span></div>`;
  if(chart) chart.destroy();
  chart = new Chart(document.getElementById('chart'),{
    type:'doughnut',
    data:{labels:['Izlaz (proizvod)','Razlika (rastur/kalo)'],
      datasets:[{data:[n.izlaz,n.rastur], backgroundColor:['#059669','#dc2626'], borderColor:'#fff', borderWidth:3}]},
    options:{responsive:true, maintainAspectRatio:false, cutout:'55%',
      plugins:{legend:{position:'bottom',labels:{padding:15,usePointStyle:true}},
        tooltip:{callbacks:{label:c=>{
          const t=c.dataset.data.reduce((a,b)=>a+b,0);
          return `${c.label}: ${fmt(c.parsed)} kg (${(c.parsed/t*100).toFixed(1)}%)`;
        }}}}}
  });
}
sel.addEventListener('change',render);
render();
