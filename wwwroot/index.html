<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FruitSysWeb</title>
    <base href="/" />
    
    <!-- Google Fonts - Inter (moderna sans-serif) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Custom CSS - VAŽAN REDOSLED! -->
    <link href="css/site.css" rel="stylesheet" />
    <link href="css/dark-theme.css" rel="stylesheet" /> <!-- NOVA TAMNA TEMA -->
    <link href="css/charts-dark.css" rel="stylesheet" /> <!-- CHART STILOVI -->
    
    <link rel="icon" type="image/png" href="favicon.png" />
</head>

<body>
    <div id="app">
        <!-- Moderan loading spinner -->
        <div style="display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #0f1729;">
            <div style="text-align: center;">
                <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem; color: #3b82f6 !important;">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p style="color: #9ca3af; margin-top: 1rem; font-family: 'Inter', sans-serif;">Učitavanje aplikacije...</p>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Blazor Scripts -->
    <script src="_framework/blazor.server.js"></script>
    
    <!-- Chart.js Integration -->
    <script src="js/charts.js"></script>
    
    <script>
        function downloadFile(base64Data, fileName, mimeType) {
            const byteCharacters = atob(base64Data);
            const byteNumbers = new Array(byteCharacters.length);
            for (let i = 0; i < byteCharacters.length; i++) {
                byteNumbers[i] = byteCharacters.charCodeAt(i);
            }
            const byteArray = new Uint8Array(byteNumbers);
            const blob = new Blob([byteArray], { type: mimeType });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
        
        // Chart.js Interop for Blazor
        window.ChartJsInterop = {
            chartInstances: {},
            
            updateChart: function (canvasId, config) {
                try {
                    if (this.chartInstances[canvasId]) {
                        this.chartInstances[canvasId].destroy();
                    }

                    const canvas = document.getElementById(canvasId);
                    if (!canvas) {
                        console.error('Canvas element not found:', canvasId);
                        return;
                    }

                    const ctx = canvas.getContext('2d');
                    
                    // Primeni dark theme boje na chart config
                    if (config.options) {
                        config.options.plugins = config.options.plugins || {};
                        config.options.plugins.legend = config.options.plugins.legend || {};
                        config.options.plugins.legend.labels = {
                            color: '#e5e7eb',
                            font: {
                                family: 'Inter',
                                size: 12
                            }
                        };
                        
                        config.options.scales = config.options.scales || {};
                        if (config.options.scales.x) {
                            config.options.scales.x.ticks = {
                                color: '#9ca3af',
                                font: {
                                    family: 'Inter'
                                }
                            };
                            config.options.scales.x.grid = {
                                color: '#374151'
                            };
                        }
                        if (config.options.scales.y) {
                            config.options.scales.y.ticks = {
                                color: '#9ca3af',
                                font: {
                                    family: 'Inter'
                                }
                            };
                            config.options.scales.y.grid = {
                                color: '#374151'
                            };
                        }
                    }
                    
                    this.chartInstances[canvasId] = new Chart(ctx, config);
                    
                    console.log('Chart updated successfully:', canvasId);
                } catch (error) {
                    console.error('Error updating chart:', error);
                }
            },
            
            destroyChart: function (canvasId) {
                try {
                    if (this.chartInstances[canvasId]) {
                        this.chartInstances[canvasId].destroy();
                        delete this.chartInstances[canvasId];
                        console.log('Chart destroyed successfully:', canvasId);
                    }
                } catch (error) {
                    console.error('Error destroying chart:', error);
                }
            }
        };

        // Clean up on page unload
        window.addEventListener('beforeunload', function() {
            Object.keys(window.ChartJsInterop.chartInstances).forEach(canvasId => {
                window.ChartJsInterop.destroyChart(canvasId);
            });
        });
    </script>
</body>

</html>
